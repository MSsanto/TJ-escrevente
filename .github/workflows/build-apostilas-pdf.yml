name: Build consolidated apostilas PDF

on:
  push:
    branches:
      - main
    paths:
      - "livros/v3/TODAS_AS_APOSTILAS_TJSP_ESCREVENTE_2027.md"
      - ".github/workflows/build-apostilas-pdf.yml"
  workflow_dispatch:

concurrency:
  group: build-consolidated-apostilas-pdf
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-pdf:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check section pagination
        run: |
          docker run --rm \
            -v "$PWD:/data" \
            -w /data \
            pandoc/latex:3.7 \
            --from=markdown-raw_tex+raw_attribute \
            --to=latex \
            "livros/v3/TODAS_AS_APOSTILAS_TJSP_ESCREVENTE_2027.md" \
            --output="build-debug.tex" \
            --toc \
            --toc-depth=3 \
            --standalone \
            -V geometry:margin=2cm \
            -V fontsize=10pt
          count=$(grep -F -c '\newpage' build-debug.tex || true)
          echo "LaTeX newpage commands: $count"
          echo "LaTeX subsubsections: $(grep -F -c '\subsubsection' build-debug.tex || true)"
          test "$count" -ge 180
          rm -f build-debug.tex

      - name: Render consolidated volume
        run: |
          docker run --rm \
            -v "$PWD:/data" \
            -w /data \
            pandoc/latex:3.7 \
            --from=markdown-raw_tex+raw_attribute \
            --pdf-engine=xelatex \
            "livros/v3/TODAS_AS_APOSTILAS_TJSP_ESCREVENTE_2027.md" \
            --output="livros/v3/TODAS_AS_APOSTILAS_TJSP_ESCREVENTE_2027.pdf" \
            --toc \
            --toc-depth=3 \
            --standalone \
            -V geometry:margin=2cm \
            -V fontsize=10pt \
            -V colorlinks=true \
            -V linkcolor=blue \
            -V urlcolor=blue

      - name: Report PDF metadata
        run: |
          python -m pip install --quiet pypdf
          python - <<'PY'
          from pathlib import Path
          from pypdf import PdfReader
          path = Path("livros/v3/TODAS_AS_APOSTILAS_TJSP_ESCREVENTE_2027.pdf")
          reader = PdfReader(str(path))
          print(f"PDF pages: {len(reader.pages)}")
          print(f"PDF bytes: {path.stat().st_size}")
          assert len(reader.pages) >= 200, "Consolidated PDF unexpectedly short; expected workbook-style pagination"
          PY

      - name: Commit generated PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "livros/v3/TODAS_AS_APOSTILAS_TJSP_ESCREVENTE_2027.pdf"
          if git diff --cached --quiet; then
            echo "PDF unchanged."
          else
            git commit -m "Build consolidated apostilas PDF"
            git push
          fi
