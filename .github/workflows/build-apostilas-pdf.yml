name: Build consolidated apostilas PDF

on:
  push:
    branches:
      - main
    paths:
      - "livros/v3/TODAS_AS_APOSTILAS_TJSP_ESCREVENTE_2027.md"
      - ".github/workflows/build-apostilas-pdf.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-pdf:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Render consolidated volume
        run: |
          docker run --rm \
            -v "$PWD:/data" \
            -w /data \
            pandoc/latex:3.7 \
            --from=markdown-raw_tex \
            --pdf-engine=xelatex \
            "livros/v3/TODAS_AS_APOSTILAS_TJSP_ESCREVENTE_2027.md" \
            --output="livros/v3/TODAS_AS_APOSTILAS_TJSP_ESCREVENTE_2027.pdf" \
            --toc \
            --toc-depth=3 \
            --standalone \
            -V geometry:margin=2cm \
            -V fontsize=10pt \
            -V mainfont="Latin Modern Roman" \
            -V colorlinks=true \
            -V linkcolor=blue \
            -V urlcolor=blue

      - name: Commit generated PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "livros/v3/TODAS_AS_APOSTILAS_TJSP_ESCREVENTE_2027.pdf"
          if git diff --cached --quiet; then
            echo "PDF unchanged."
          else
            git commit -m "Build consolidated apostilas PDF"
            git push
          fi
